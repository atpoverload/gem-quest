curses:
  Poison:
    name: Poison
    effect: Deals damage every turn.
    flavor: 12 damage from brock. 15 from forest. 8 from forest to Pewter. 10 from rock tunnel. 10 from route 22. 22 from mt moon without grass.
  Sleep:
    name: Sleep
    effect: Can't act until you wake up.
    flavor: GOTTA WAKE UP DUDE!!!
  Break:
    name: Break
    effect: Reduced defenses.
    flavor:
  Doom:
    name: Doom
    effect: Death comes for you.
    flavor: What a horrible night to have a curse.
  Flinch:
    name: Flinch
    effect: Skip next action.
    flavor: BONK!!
  Banish:
    name: Banish
    effect: May disappear forever.
    flavor: Take a lap.
  Burnt:
    name: Burnt
    effect: Causes damage on attacking.
    flavor: Severe burns that hurts when attacking.
  Freeze:
    name: Freeze
    effect: May be unable to move.
    flavor: A cold chill that may prevent skills.
  Shock:
    name: Shock
    effect: Reduced accuracy.
    flavor: Convulsions that reduces accuracy.
blessings:
  Boost:
    name: Boost
    effect: Deal extra weapon damage.
    flavor: GIMME THE BOOOOST!!!
  Shield:
    name: Shield
    effect: Prevent the next attack.
    flavor: Hinorpa protect me.
  Lucky:
    name: Lucky
    effect: You are very lucky.
    flavor: SOOO LUCKY!!
  Tumble:
    name: Tumble
